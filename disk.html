  /* textura de etiqueta: retícula finísima color traza (sin scanlines CRT) */

    background-image:
      linear-gradient(rgba(110,112,129,.30) 1px,transparent 1px),
      linear-gradient(90deg,rgba(110,112,129,.30) 1px,transparent 1px);
    background-size:26px 26px,26px 26px;
    background-position:center center}

  /* marcas de encuadre tipo etiqueta impresa */
  .corner{position:fixed;width:26px;height:26px;z-index:40;pointer-events:none;border:1px solid var(--trace);opacity:.9}
  .corner.tl{top:12px;left:12px;border-right:none;border-bottom:none}
  .corner.tr{top:12px;right:12px;border-left:none;border-bottom:none}
  .corner.bl{bottom:12px;left:12px;border-right:none;border-top:none}
  .corner.br{bottom:12px;right:12px;border-left:none;border-top:none}

  /* ÚNICA INSTRUCCIÓN — panel impreso, esquinas rectas, tinta de etiqueta */
  #hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
    font-size:12px;font-weight:600;line-height:1.45;letter-spacing:.18em;text-align:center;color:var(--ink);
    background:rgba(20,21,31,.86);border:1px solid var(--trace);padding:11px 18px;
    width:max-content;max-width:88vw;pointer-events:none;
    box-shadow:0 0 0 1px rgba(27,29,43,.9), inset 0 0 0 1px rgba(48,49,66,.9)}
  #hint b{color:var(--ink-hi)}
  #hint .k{color:var(--trace);padding:0 .45em}

  /* barra de búsqueda: línea de traza, no neón */
  #scanbar{position:fixed;left:10%;right:10%;height:1px;background:var(--trace);z-index:35;pointer-events:none;
    opacity:.9;top:20%;animation:scanmove 2.8s cubic-bezier(.45,0,.55,1) infinite}
  #scanbar::before,#scanbar::after{content:'';position:absolute;top:-3px;width:1px;height:7px;background:var(--trace)}
  #scanbar::before{left:0}
  #scanbar::after{right:0}
  @keyframes scanmove{0%{top:16%}50%{top:80%}100%{top:16%}}

const BLUE = 0x6E7081;        // traza PCB de la etiqueta
const BLUE_BRIGHT = 0xCECCCC;  // tinta del logo
const PANEL = 0x303142;        // estructura

/* ============================================================
   OPTIMIZACIÓN FPS — análisis previo:
   - SAB/SharedArrayBuffer: requiere COOP+COEP (no disponible en hosts
     estáticos) y MindAR no lo usa (su worker comunica por postMessage).
     El cuello de botella real es el CV de tfjs en el hilo principal,
     que escala con la resolución del stream de cámara.
   - Por eso: cámara 640x480, pixelRatio capado, sin render cuando no
     hay target, y glow con fat-lines (sin bloom/postprocesado).
   ============================================================ */
let rendererRef = null;
const allLineMats = [];
function updateLineRes(){
  if (!rendererRef) return;
  const s = rendererRef.getDrawingBufferSize(new THREE.Vector2());
  for (const m of allLineMats) m.resolution.set(s.x, s.y);
}

/* ============================================================
   HOLOGRAMA — wireframe azul, industrial, sin bloom ni fancy
   ============================================================ */
function makeCircuitTexture(){
  // trazas PCB como en la etiqueta del disquete — líneas a 90°
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.clearRect(0,0,512,512);
  g.strokeStyle = 'rgba(206,204,204,0.85)'; g.lineWidth = 5;
  const trace = (pts) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke();
    g.fillStyle = 'rgba(206,204,204,0.9)'; g.beginPath(); g.arc(pts[pts.length-1][0], pts[pts.length-1][1], 9, 0, 7); g.fill(); };
  trace([[40,60],[200,60],[200,140],[420,140]]);
  trace([[40,110],[150,110],[150,200],[420,200]]);
  trace([[40,160],[110,160],[110,260],[420,260]]);
  trace([[40,320],[300,320],[300,400],[470,400]]);
  trace([[40,430],[470,430]]);
  // pads
  g.fillStyle = 'rgba(206,204,204,0.9)';
  for(let i=0;i<5;i++){ g.fillRect(430, 60+i*50, 22, 10); }
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

function buildHologram(){
  // MindAR normaliza el target: ancho = 1, alto = 875/1200 = 0.729, origen = centro.
  // Centro del logo dentro de la etiqueta (medido en label_target.png 1200x875)
  const CX = (585 - 600) / 1200;         // -0.0125
  const CY = (437.5 - 735) / 1200;       // -0.2479 (abajo del centro)

  const root = new THREE.Group();        // espacio del target (ancho = 1)
  const holo = new THREE.Group();        // holograma flotante sobre el logo
  holo.position.set(CX, CY, 0.30);
  root.add(holo);

  const flickMats = [];                  // materiales que parpadean con boot/glitch
  const reg = (m, base) => { flickMats.push({ m, base }); return m; };

  function lineRes(){
    if (rendererRef) { const s = rendererRef.getDrawingBufferSize(new THREE.Vector2()); return [s.x, s.y]; }
    return [innerWidth, innerHeight];
  }

  // Línea con glow sutil: halo ancho semitransparente + núcleo fino.
  // Fat-lines (LineSegments2) = glow sin bloom ni postprocesado (barato en móviles).
  function glowSegments(segs, { color = BLUE_BRIGHT, core = 0.95, halo = 0.22, coreW = 2, haloW = 5 } = {}){
    const g = new THREE.Group();
    const geo = new LineSegmentsGeometry();
    geo.setPositions(segs);
    const [rx, ry] = lineRes();
    const mk = (w, base) => {
      const m = new LineMaterial({ color, linewidth: w, transparent: true, opacity: base,
        blending: THREE.AdditiveBlending, depthWrite: false });
      m.resolution.set(rx, ry);
      allLineMats.push(m);
      reg(m, base);
      return new LineSegments2(geo, m);
    };
    g.add(mk(haloW, halo));
    g.add(mk(coreW, core));
    return g;
  }

  // segmentos desde un EdgesGeometry
  function edgesSegs(geo){
    const pt = geo.attributes.position, a = [];
    for (let i = 0; i < pt.count; i++) a.push(pt.getX(i), pt.getY(i), pt.getZ(i));
    return a;
  }

  // círculo como segmentos
  function circleSegs(r){
    const a = [], N = 72;
    for (let i = 0; i < N; i++){
      const t1 = i/N*Math.PI*2, t2 = (i+1)/N*Math.PI*2;
      a.push(Math.cos(t1)*r, Math.sin(t1)*r, 0, Math.cos(t2)*r, Math.sin(t2)*r, 0);
    }
    return a;
  }

  // elipse punteada (segmentos con huecos, sin dashed)
  function dashedEllipseSegs(rx, ry){
    const a = [], N = 64;
    for (let i = 0; i < N; i++){
      if (i % 3 === 2) continue;                       // hueco
      const t1 = i/N*Math.PI*2, t2 = (i+1)/N*Math.PI*2;
      a.push(Math.cos(t1)*rx, Math.sin(t1)*ry, 0, Math.cos(t2)*rx, Math.sin(t2)*ry, 0);
    }
    return a;
  }

  const wireMat = new THREE.MeshBasicMaterial({ color: BLUE, wireframe: true, transparent: true, opacity: 0.38 });
  reg(wireMat, 0.38);

  /* --- retícula impresa sobre el logo (marcas de registro) --- */
  const reticle = new THREE.Group(); reticle.position.z = 0.012; root.add(reticle);
  const RW = 0.352, RH = 0.0667, L = 0.05;            // semianchos del logo
  const bracketSegs = [];
  [[-RW,-RH,1,1],[RW,-RH,-1,1],[-RW,RH,1,-1],[RW,RH,-1,-1]].forEach(([x,y,sx,sy])=>{
    bracketSegs.push(CX+x, CY+y, 0, CX+x+sx*L, CY+y, 0);
    bracketSegs.push(CX+x, CY+y, 0, CX+x, CY+y+sy*L, 0);
  });
  reticle.add(glowSegments(bracketSegs, { color: BLUE, core: 0.9, halo: 0.2 }));
  const calRing = glowSegments(dashedEllipseSegs(0.48, 0.16), { color: BLUE, core: 0.55, halo: 0.12 });
  calRing.position.set(CX, CY, 0);
  reticle.add(calRing);

  // rejilla base tenue
  const grid = new THREE.GridHelper(1.2, 12, BLUE, PANEL);
  grid.rotation.x = Math.PI/2; grid.position.z = 0.008;
  grid.material.transparent = true; grid.material.opacity = 0.22;
  grid.material.blending = THREE.AdditiveBlending; grid.material.depthWrite = false;
  reg(grid.material, 0.22);
  root.add(grid);

  // trazas guía del logo al holograma (como el circuito de la etiqueta)
  const beamSegs = [];
  [[-0.30,-0.05],[0.30,-0.05],[-0.30,0.05],[0.30,0.05]].forEach(([x,y])=>{
    beamSegs.push(CX+x, CY+y, 0.01, CX+x*0.55, CY+y*0.55, 0.30);
  });
  root.add(glowSegments(beamSegs, { color: BLUE, core: 0.30, halo: 0.08 }));

  /* --- disquete 3.5" wireframe --- */
  const floppy = new THREE.Group(); holo.add(floppy);
  const S = 0.45;                                     // lado del disquete
  const bodyGeo = new THREE.BoxGeometry(S, S, S*0.10);
  floppy.add(new THREE.Mesh(bodyGeo, wireMat));
  floppy.add(glowSegments(edgesSegs(new THREE.EdgesGeometry(bodyGeo)), { color: BLUE_BRIGHT, core: 0.95, halo: 0.22 }));
  // shutter metálico
  const shutGeo = new THREE.BoxGeometry(S*0.54, S*0.36, S*0.11);
  const shut = new THREE.Mesh(shutGeo, wireMat); shut.position.set(S*0.11, S*0.29, 0); floppy.add(shut);
  const shutEdges = glowSegments(edgesSegs(new THREE.EdgesGeometry(shutGeo)), { color: BLUE_BRIGHT, core: 0.9, halo: 0.2 });
  shutEdges.position.copy(shut.position); floppy.add(shutEdges);
  // etiqueta con trazas PCB
  const label = new THREE.Mesh(new THREE.PlaneGeometry(S*0.82, S*0.43),
    new THREE.MeshBasicMaterial({ map: makeCircuitTexture(), transparent: true, opacity: 0.55, depthWrite: false }));
  label.position.set(0, -S*0.23, S*0.055); floppy.add(label);
  // buje central
  const hub = new THREE.Mesh(new THREE.BoxGeometry(S*0.13, S*0.13, S*0.11), wireMat);
  hub.position.set(-S*0.29, S*0.29, 0); floppy.add(hub);

  /* --- anillos giroscópicos --- */
  const ring1 = glowSegments(circleSegs(S*0.85), { color: BLUE_BRIGHT, core: 0.9, halo: 0.2 });
  ring1.rotation.x = Math.PI/2.4; holo.add(ring1);
  const ring2 = glowSegments(circleSegs(S*1.00), { color: BLUE, core: 0.5, halo: 0.12 });
  ring2.rotation.y = Math.PI/2.6; holo.add(ring2);

  /* --- etiqueta vectorial OPEN BANDCAMP (inferior derecha del marco) --- */
  // tipografía de trazos (vectores, sin raster): glifos en caja 0.62 x 1.0
  const GLYPHS = {
    O: [[[0.08,0],[0.5,0],[0.62,0.18],[0.62,0.82],[0.5,1],[0.08,1],[0,0.82],[0,0.18],[0.08,0]]],
    P: [[[0,0],[0,1],[0.42,1],[0.6,0.8],[0.6,0.58],[0.42,0.38],[0,0.38]]],
    E: [[[0.58,0],[0,0],[0,1],[0.58,1]], [[0,0.5],[0.42,0.5]]],
    N: [[[0,0],[0,1],[0.62,0],[0.62,1]]],
    B: [[[0,0],[0,1],[0.4,1],[0.58,0.82],[0.58,0.62],[0.4,0.5],[0.56,0.36],[0.56,0.16],[0.38,0],[0,0]]],
    A: [[[0,0],[0.31,1],[0.62,0]], [[0.13,0.36],[0.49,0.36]]],
    D: [[[0,0],[0,1],[0.34,1],[0.6,0.74],[0.6,0.26],[0.34,0],[0,0]]],
    C: [[[0.56,0.14],[0.36,0],[0.1,0.16],[0.02,0.5],[0.1,0.84],[0.36,1],[0.56,0.86]]],
    M: [[[0,0],[0,1],[0.31,0.42],[0.62,1],[0.62,0]]],
  };
  function textSegs(text, fontH){
    const adv = fontH * 0.8, segs = [];
    let x = 0;
    for (const ch of text){
      const g = GLYPHS[ch];
      if (g) for (const poly of g)
        for (let i = 1; i < poly.length; i++)
          segs.push(x + poly[i-1][0]*fontH, poly[i-1][1]*fontH, 0, x + poly[i][0]*fontH, poly[i][1]*fontH, 0);
      x += adv;
    }
    return { segs, width: x - adv + fontH*0.62 };
  }
  function buildTag(){
    const tag = new THREE.Group();
    const fontH = 0.026;
    const { segs, width } = textSegs('OPEN BANDCAMP', fontH);
    const ox = 0.05, oy = -0.285;                    // origen (izq. inferior del texto)
    const pad = 0.018;
    const x0 = ox - pad, y0 = oy - pad, x1 = ox + width + pad, y1 = oy + fontH + pad;
    const cx = S*0.5, cy = -S*0.5;                   // esquina inferior derecha del disquete
    const frameSegs = [
      x0,y0,0, x1,y0,0,  x1,y0,0, x1,y1,0,  x1,y1,0, x0,y1,0,  x0,y1,0, x0,y0,0,
      // línea guía desde la esquina del disquete al marco
      cx, cy, 0, 0.10, y1, 0,
      // marcador cuadrado en la esquina
      cx-0.012, cy-0.012, 0, cx+0.012, cy-0.012, 0,
      cx+0.012, cy-0.012, 0, cx+0.012, cy+0.012, 0,
      cx+0.012, cy+0.012, 0, cx-0.012, cy+0.012, 0,
      cx-0.012, cy+0.012, 0, cx-0.012, cy-0.012, 0,
    ];
    tag.add(glowSegments(frameSegs, { color: BLUE, core: 0.55, halo: 0.12 }));
    const textG = glowSegments(segs, { color: BLUE_BRIGHT, core: 0.9, halo: 0.2 });
    textG.position.set(ox, oy, 0);
    tag.add(textG);
    return tag;
  }
  holo.add(buildTag());

  /* --- partículas --- */
  const N = 150, pos = new Float32Array(N*3), spd = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-0.5)*S*1.7; pos[i*3+1]=(Math.random()-0.5)*S*1.7; pos[i*3+2]=(Math.random()-0.5)*S;
    spd[i]=0.05+Math.random()*0.12;
  }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  holo.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: BLUE_BRIGHT, size: S*0.018, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending })));

  /* --- plano de escaneo --- */
  const scan = new THREE.Mesh(new THREE.PlaneGeometry(S*1.35, S*0.035),
    new THREE.MeshBasicMaterial({ color: BLUE_BRIGHT, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending }));
  holo.add(scan);

  /* --- hitbox clickeable: cubre disquete + etiqueta --- */
  const hitbox = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.95, 0.4),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hitbox.position.set(0.08, -0.02, 0); hitbox.name='hitbox'; holo.add(hitbox);

  let bootT = -1;
  const clock = { t: 0 };

  function update(dt){
    clock.t += dt;
    const t = clock.t;
    const on = bootT >= 0;

    if(on){
      bootT += dt;
      const k = Math.min(bootT/0.9, 1);
      holo.scale.setScalar(Math.max(Math.floor(k*10)/10, 0.001));
      let flick = 0.82 + Math.random()*0.18;
      if(Math.random() < 0.045) flick = 0.15;
      if(bootT < 0.9 && Math.random() < 0.25) flick = 0.25;
      for (const f of flickMats) f.m.opacity = f.base * flick;
      floppy.position.x = (Math.random() < 0.05) ? (Math.random()-0.5)*S*0.05 : 0;
      holo.visible = true;
    } else {
      holo.visible = false;
    }

    floppy.rotation.y += dt*0.55;
    floppy.rotation.x = Math.sin(t*0.7)*0.12;
    floppy.position.y = Math.sin(t*1.3)*S*0.05;
    ring1.rotation.z += dt*0.7; ring2.rotation.x += dt*0.4;
    calRing.rotation.z -= dt*0.12;

    const arr = pGeo.attributes.position.array;
    for(let i=0;i<N;i++){ arr[i*3+1] += spd[i]*dt; if(arr[i*3+1] > 0.5) arr[i*3+1] = -0.5; }
    pGeo.attributes.position.needsUpdate = true;

    scan.position.y = ((t*0.45) % 1) * S*1.6 - S*0.8;
    scan.material.opacity = 0.35 + Math.sin(t*6)*0.15;
  }

  return { root, holo, hitbox, update, setOn:(v)=>{ bootT = v ? 0 : -1; }, isOn:()=> bootT >= 0 };
}

/* ============================================================
   AR DIRECTO — sin pantalla de intro. Tap en holograma → Bandcamp
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

async function start(){
  // marcador embebido → Blob URL (autocontenido); fallback a archivo externo
  let markerSrc = './marker.mind';
  try{
    const bin = atob(MARKER_B64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    markerSrc = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  }catch(e){ console.warn('marker embebido no disponible, usando ./marker.mind', e); }

  const mindarThree = new MindARThree({
    container: $('#container'),
    imageTargetSrc: markerSrc,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',  // sin UI de texto de MindAR
  });
  const { renderer, scene, camera } = mindarThree;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // cap: menos fill-rate en móviles low-cost
  // el anchor de MindAR escala a px de cámara (~1200): planos amplios
  camera.near = 1;
  camera.far = 20000;
  camera.updateProjectionMatrix();

  rendererRef = renderer;
  const holo = buildHologram();
  const anchor = mindarThree.addAnchor(0);
  anchor.group.add(holo.root);
  holo.setOn(false);

  anchor.onTargetFound = () => { holo.setOn(true); scanbar.style.display = 'none'; };
  anchor.onTargetLost  = () => { holo.setOn(false); scanbar.style.display = 'block'; };

  // tap / click sobre el holograma → Bandcamp (solo si está materializado)
  const onTap = (e) => {
    if(!holo.isOn()) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    if(raycaster.intersectObject(holo.hitbox, false).length) openBandcamp();
  };
  // en window: el div del CSS renderer de MindAR cubre el canvas WebGL e intercepta el tap
  addEventListener('pointerdown', onTap);

  // Optimización FPS: MindAR procesa a la resolución nativa del stream.
  // 640x480 = ~4x menos píxeles para detector+tracker (el costo dominante en tfjs).
  const md = navigator.mediaDevices;
  const origGUM = md && md.getUserMedia ? md.getUserMedia.bind(md) : null;
  if (origGUM) {
    md.getUserMedia = (constraints) => {
      if (constraints && constraints.video && typeof constraints.video === 'object') {
        constraints.video.width = { ideal: 640 };
        constraints.video.height = { ideal: 480 };
      }
      return origGUM(constraints);
    };
  }
  try { await mindarThree.start(); }
  finally { if (origGUM) md.getUserMedia = origGUM; }
  // MindAR reescribe near/far en su resize(): los volvemos a fijar
  const fixPlanes = () => { camera.near = 1; camera.far = 20000; camera.updateProjectionMatrix(); };
  fixPlanes();
  addEventListener('resize', fixPlanes);
  updateLineRes();
  addEventListener('resize', updateLineRes);

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (anchor.group.visible) {          // sin target: no renderizar (ahorro GPU/batería)
      holo.update(dt);
      renderer.render(scene, camera);
    }
  });
}

start().catch(err => {
  console.error(err);
  // sin UI de texto: solo línea de escaneo en rojo + log
  scanbar.style.background = '#8E8993';
  scanbar.style.height = '1px';
});
