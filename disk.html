<style>
  /* INDUSTRIAL — sin texto de UI, solo la instrucción */
  :root{
    --blue:#00d9ff;
    --ink:#e8fbff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);
    font-family:"Courier New",Courier,monospace;text-transform:uppercase}
  #container{position:fixed;inset:0;width:100%;height:100%}
  #container canvas{display:block}

  /* CRT scanlines + vignette — industrial */
  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.14;
    background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,217,255,.35) 2px 3px,transparent 3px 4px)}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:29;
    box-shadow:inset 0 0 120px rgba(0,0,0,.85)}

  /* esquinas HUD (gráficos, sin texto) */
  .corner{position:fixed;width:22px;height:22px;z-index:40;pointer-events:none;border:2px solid var(--blue);opacity:.85}
  .corner.tl{top:10px;left:10px;border-right:none;border-bottom:none}
  .corner.tr{top:10px;right:10px;border-left:none;border-bottom:none}
  .corner.bl{bottom:10px;left:10px;border-right:none;border-top:none}

  /* ÚNICA INSTRUCCIÓN */
  #hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
    font-size:12px;line-height:1.5;letter-spacing:.14em;text-align:center;color:var(--blue);
    background:rgba(0,0,0,.7);border:1px solid var(--blue);padding:10px 16px;width:max-content;max-width:86vw;
    pointer-events:none}
  #hint b{color:var(--ink)}

  /* línea de escaneo cuando busca */
  #scanbar{position:fixed;left:8%;right:8%;height:2px;background:var(--blue);z-index:35;pointer-events:none;
    box-shadow:0 0 12px var(--blue);opacity:.8;top:20%;animation:scanmove 2.4s linear infinite}
  @keyframes scanmove{0%{top:18%}50%{top:78%}100%{top:18%}}
</style>

/* ============================================================
   HOLOGRAMA — wireframe azul, industrial, sin bloom ni fancy
   ============================================================ */
function makeCircuitTexture(){
  // trazas PCB como en la etiqueta del disquete — líneas a 90°
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.clearRect(0,0,512,512);
  g.strokeStyle = 'rgba(0,217,255,0.85)'; g.lineWidth = 5;
  const trace = (pts) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke();
    g.fillStyle = 'rgba(0,217,255,0.9)'; g.beginPath(); g.arc(pts[pts.length-1][0], pts[pts.length-1][1], 9, 0, 7); g.fill(); };
  trace([[40,60],[200,60],[200,140],[420,140]]);
  trace([[40,110],[150,110],[150,200],[420,200]]);
  trace([[40,160],[110,160],[110,260],[420,260]]);
  trace([[40,320],[300,320],[300,400],[470,400]]);
  trace([[40,430],[470,430]]);
  // pads
  g.fillStyle = 'rgba(0,217,255,0.9)';
  for(let i=0;i<5;i++){ g.fillRect(430, 60+i*50, 22, 10); }
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

function buildHologram(){
  const root = new THREE.Group();          // espacio del marcador (ancho = 1)
  const holo = new THREE.Group();          // holograma flotante
  holo.position.set(0, 0, 0.34);
  root.add(holo);

  const lineMat  = new THREE.LineBasicMaterial({ color: BLUE_BRIGHT, transparent: true, opacity: 0.95 });
  const wireMat  = new THREE.MeshBasicMaterial({ color: BLUE, wireframe: true, transparent: true, opacity: 0.38 });
  const faintMat = new THREE.LineBasicMaterial({ color: BLUE, transparent: true, opacity: 0.35 });

  /* --- retícula sobre el logo (no rota, marca el target) --- */
  const reticle = new THREE.Group(); reticle.position.z = 0.012; root.add(reticle);
  const bw = 0.51, bh = 0.088, bl = 0.07, bt = 0.007; // ajustado al logo (ancho=1, alto=0.179)
  [[-bw,-bh,1,1],[bw,-bh,-1,1],[-bw,bh,1,-1],[bw,bh,-1,-1]].forEach(([x,y,sx,sy])=>{
    const h = new THREE.Mesh(new THREE.BoxGeometry(bl, bt, 0.002), new THREE.MeshBasicMaterial({ color: BLUE, transparent: true }));
    h.position.set(x + sx*bl/2, y, 0); reticle.add(h);
    const v = new THREE.Mesh(new THREE.BoxGeometry(bt, bl, 0.002), new THREE.MeshBasicMaterial({ color: BLUE, transparent: true }));
    v.position.set(x, y + sy*bl/2, 0); reticle.add(v);
  });
  // anillo punteado
  const ringPts = [];
  for(let i=0;i<=64;i++){ const a = i/64*Math.PI*2; ringPts.push(new THREE.Vector3(Math.cos(a)*0.60, Math.sin(a)*0.155, 0)); }
  const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
  const ring = new THREE.Line(ringGeo, new THREE.LineDashedMaterial({ color: BLUE, dashSize: 0.03, gapSize: 0.02, transparent: true, opacity: 0.6 }));
  ring.computeLineDistances(); reticle.add(ring);

  // rejilla base tenue
  const grid = new THREE.GridHelper(1.2, 12, BLUE, 0x0a3d52);
  grid.rotation.x = Math.PI/2; grid.position.z = 0.008;
  grid.material.transparent = true; grid.material.opacity = 0.22;
  root.add(grid);

  /* --- disquete 3.5" wireframe --- */
  const floppy = new THREE.Group(); holo.add(floppy);
  const bodyGeo = new THREE.BoxGeometry(0.56, 0.56, 0.055);
  floppy.add(new THREE.Mesh(bodyGeo, wireMat));
  floppy.add(new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo), lineMat));
  // ventana metálica (shutter)
  const shutGeo = new THREE.BoxGeometry(0.30, 0.20, 0.06);
  const shut = new THREE.Mesh(shutGeo, wireMat); shut.position.set(0.06, 0.16, 0); floppy.add(shut);
  const shutLines = new THREE.LineSegments(new THREE.EdgesGeometry(shutGeo), lineMat);
  shutLines.position.copy(shut.position); floppy.add(shutLines);
  // etiqueta con trazas PCB (referencia al diseño del disquete)
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.24),
    new THREE.MeshBasicMaterial({ map: makeCircuitTexture(), transparent: true, opacity: 0.55, depthWrite: false }));
  label.position.set(0, -0.13, 0.030); floppy.add(label);
  // buje central
  const hub = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.06), wireMat);
  hub.position.set(-0.16, 0.16, 0); floppy.add(hub);

  /* --- anillos giroscópicos (líneas, no torus fancy) --- */
  function circleLine(r, mat){
    const pts = []; for(let i=0;i<=72;i++){ const a=i/72*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, 0)); }
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
  }
  const ring1 = circleLine(0.44, lineMat); ring1.rotation.x = Math.PI/2.4; holo.add(ring1);
  const ring2 = circleLine(0.50, faintMat); ring2.rotation.y = Math.PI/2.6; holo.add(ring2);

  /* --- partículas (polvo digital, deriva hacia arriba) --- */
  const N = 130, pos = new Float32Array(N*3), spd = new Float32Array(N);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-0.5)*0.9; pos[i*3+1]=(Math.random()-0.5)*0.9; pos[i*3+2]=(Math.random()-0.5)*0.5; spd[i]=0.05+Math.random()*0.12; }
  const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: BLUE_BRIGHT, size: 0.009, transparent: true, opacity: 0.75, depthWrite: false }));
  holo.add(particles);

  /* --- plano de escaneo vertical --- */
  const scan = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.018),
    new THREE.MeshBasicMaterial({ color: BLUE_BRIGHT, transparent: true, opacity: 0.5, depthWrite: false }));
  holo.add(scan);

  /* --- haces desde la retícula al holograma --- */
  const beamMat = new THREE.LineBasicMaterial({ color: BLUE, transparent: true, opacity: 0.28 });
  [[-0.3,-0.04],[0.3,-0.04],[-0.3,0.04],[0.3,0.04]].forEach(([x,y])=>{
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,y,0.01), new THREE.Vector3(x*0.5, y*0.5, 0.34)]);
    root.add(new THREE.Line(g, beamMat));
  });

  /* --- hitbox invisible clickeable (todo el holograma) --- */
  const hitbox = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.05, 0.45),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hitbox.position.set(0, 0.02, 0); hitbox.name = 'hitbox'; holo.add(hitbox);

  let bootT = -1; // -1 = apagado, >=0 = materializando
  const clock = { t: 0 };

  function update(dt){
    clock.t += dt;
    const t = clock.t;
    const on = bootT >= 0;

    // boot escalonado 8-bit (0.9s) + flicker industrial
    if(on){
      bootT += dt;
      const k = Math.min(bootT / 0.9, 1);
      const stepped = Math.floor(k * 10) / 10;
      holo.scale.setScalar(Math.max(stepped, 0.001));
      let flick = 0.82 + Math.random()*0.18;
      if(Math.random() < 0.045) flick = 0.15;                       // glitch aleatorio
      if(bootT < 0.9 && Math.random() < 0.25) flick = 0.25;         // parpadeo de arranque
      wireMat.opacity = 0.38 * flick; lineMat.opacity = 0.95 * flick;
      faintMat.opacity = 0.35 * flick;
      floppy.position.x = (Math.random() < 0.05) ? (Math.random()-0.5)*0.03 : 0; // salto glitch
      holo.visible = true;
    } else {
      holo.visible = false;
    }

    // idle: rotación lenta, balanceo, anillos
    floppy.rotation.y += dt * 0.55;
    floppy.rotation.x = Math.sin(t * 0.7) * 0.12;
    floppy.position.y = Math.sin(t * 1.3) * 0.028;
    ring1.rotation.z += dt * 0.7; ring2.rotation.x += dt * 0.4;
    ring.rotation.z -= dt * 0.25;
    reticle.children.forEach(m=>{ if(m.material) m.material.opacity = 0.7 + Math.sin(t*3)*0.3; });

    // partículas suben
    const arr = pGeo.attributes.position.array;
    for(let i=0;i<N;i++){ arr[i*3+1] += spd[i]*dt; if(arr[i*3+1] > 0.55) arr[i*3+1] = -0.55; }
    pGeo.attributes.position.needsUpdate = true;

    // escaneo
    scan.position.y = ((t * 0.45) % 1.1) - 0.55;
    scan.material.opacity = 0.35 + Math.sin(t*6)*0.15;
  }

  return { root, holo, hitbox, update, setOn: (v)=>{ bootT = v ? 0 : -1; }, isOn: ()=> bootT >= 0 };
}

/* ============================================================
   AR DIRECTO — sin pantalla de intro. Tap en holograma → Bandcamp
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

async function start(){
  // marcador embebido → Blob URL (autocontenido); fallback a archivo externo
  let markerSrc = './marker.mind';
  try{
    const bin = atob(MARKER_B64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    markerSrc = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
  }catch(e){ console.warn('marker embebido no disponible, usando ./marker.mind', e); }

  const mindarThree = new MindARThree({
    container: $('#container'),
    imageTargetSrc: markerSrc,
    filterMinCF: 0.0001,
    filterBeta: 0.001,
  });
  const { renderer, scene, camera } = mindarThree;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const holo = buildHologram();
  const anchor = mindarThree.addAnchor(0);
  anchor.group.add(holo.root);
  holo.setOn(false);

  anchor.onTargetFound = () => { holo.setOn(true); scanbar.style.display = 'none'; };
  anchor.onTargetLost  = () => { holo.setOn(false); scanbar.style.display = 'block'; };

  // tap / click sobre el holograma → Bandcamp (solo si está materializado)
  const onTap = (e) => {
    if(!holo.isOn()) return;
    const rect = renderer.domElement.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    if(raycaster.intersectObject(holo.hitbox, false).length) openBandcamp();
  };
  renderer.domElement.addEventListener('pointerdown', onTap);

  await mindarThree.start();
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    holo.update(clock.getDelta());
    renderer.render(scene, camera);
  });
}

start().catch(err => {
  console.error(err);
  // sin UI de texto: solo línea de escaneo en rojo + log
